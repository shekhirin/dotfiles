name: Flake Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # iets builds the checks of the runner's system (aarch64-darwin on
      # macos-latest, x86_64-linux on ubuntu-latest).
      - name: Run flake checks
        run: nix run --inputs-from . iets -- build .#checks
